x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 50M

services:
  judge0-server:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    volumes:
      - ./docker/judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    # Bound to localhost only — for local API/smoke tests; not LAN-exposed.
    ports:
      - "127.0.0.1:2358:2358"
    networks:
      - sfera
    depends_on:
      - judge0-db
      - judge0-redis
    <<: *default-logging
    restart: unless-stopped

  judge0-worker:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    command: ["./scripts/workers"]
    volumes:
      - ./docker/judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    networks:
      - sfera
    depends_on:
      - judge0-db
      - judge0-redis
    <<: *default-logging
    restart: unless-stopped

  judge0-db:
    image: postgres:16.2
    platform: linux/amd64
    env_file: ./docker/judge0/judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data
    networks:
      - sfera
    <<: *default-logging
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    platform: linux/amd64
    command:
      [
        "bash",
        "-c",
        'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    env_file: ./docker/judge0/judge0.conf
    networks:
      - sfera
    <<: *default-logging
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      JUDGE0_URL: http://judge0-server:2358
      PROBLEMS_DIR: /app/data/problems
    ports:
      - "3001:3001"
    networks:
      - sfera
    depends_on:
      - judge0-server
      - judge0-worker
    <<: *default-logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    networks:
      - sfera
    depends_on:
      - api
    <<: *default-logging
    restart: unless-stopped

networks:
  sfera:
    driver: bridge

volumes:
  judge0-data:
