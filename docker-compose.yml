x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 50M

services:
  judge0-server:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    volumes:
      - ./docker/judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    # Bound to localhost only — for local API/smoke tests; not LAN-exposed.
    ports:
      - "127.0.0.1:2358:2358"
    networks:
      - sfera
    depends_on:
      - judge0-db
      - judge0-redis
    <<: *default-logging
    restart: unless-stopped

  judge0-worker:
    image: judge0/judge0:1.13.1
    platform: linux/amd64
    command: ["./scripts/workers"]
    volumes:
      - ./docker/judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    networks:
      - sfera
    depends_on:
      - judge0-db
      - judge0-redis
    <<: *default-logging
    restart: unless-stopped

  judge0-db:
    image: postgres:16.2
    platform: linux/amd64
    env_file: ./docker/judge0/judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data
    networks:
      - sfera
    <<: *default-logging
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    platform: linux/amd64
    command:
      [
        "bash",
        "-c",
        'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    env_file: ./docker/judge0/judge0.conf
    networks:
      - sfera
    <<: *default-logging
    restart: unless-stopped

  # The application database — deliberately separate from judge0-db. Judge0
  # manages its own schema and our migrations have no business in it.
  app-db:
    image: postgres:16.2
    environment:
      POSTGRES_USER: sfera
      POSTGRES_PASSWORD: sfera
      POSTGRES_DB: sfera
    volumes:
      - app-db-data:/var/lib/postgresql/data
    # Localhost only — for inspecting with psql during development.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfera -d sfera"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sfera
    <<: *default-logging
    restart: unless-stopped

  # The judging queue — a separate Redis from judge0-redis, so our jobs do not
  # mix with Judge0's internal queue.
  app-redis:
    image: redis:7.2.4
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - app-redis-data:/data
    # Localhost only — for development outside Docker and for redis-cli.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sfera
    <<: *default-logging
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://sfera:sfera@app-db:5432/sfera
      REDIS_URL: redis://app-redis:6379
      JUDGE0_URL: http://judge0-server:2358
      # The ceiling is the number of Judge0 workers — higher only floods the sandbox.
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
    networks:
      - sfera
    depends_on:
      app-db:
        condition: service_healthy
      app-redis:
        condition: service_healthy
      judge0-server:
        condition: service_started
      judge0-worker:
        condition: service_started
    <<: *default-logging
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      JUDGE0_URL: http://judge0-server:2358
      PROBLEMS_DIR: /app/data/problems
      DATABASE_URL: postgres://sfera:sfera@app-db:5432/sfera
      REDIS_URL: redis://app-redis:6379
      # No default on purpose — compose refuses to start without the secret in .env.
      JWT_SECRET: ${JWT_SECRET:?ustaw JWT_SECRET w pliku .env (min. 32 znaki)}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      # We run on HTTP locally, so the cookie cannot be secure. When deploying
      # za HTTPS ustaw true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3001:3001"
    networks:
      - sfera
    depends_on:
      app-db:
        condition: service_healthy
      app-redis:
        condition: service_healthy
      judge0-server:
        condition: service_started
      judge0-worker:
        condition: service_started
    <<: *default-logging
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    networks:
      - sfera
    depends_on:
      - api
    <<: *default-logging
    restart: unless-stopped

networks:
  sfera:
    driver: bridge

volumes:
  judge0-data:
  app-db-data:
  app-redis-data:
